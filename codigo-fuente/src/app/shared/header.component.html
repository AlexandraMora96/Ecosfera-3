<header class="site-header">
  <div class="shell header-row">
    <a
      class="brand"
      routerLink="/"
      aria-label="Ecosfera, ir al inicio"
      (click)="open.set(false)"
      ><span class="brand-mark" aria-hidden="true">◉</span> ECOSFERA</a
    >
    <button
      class="menu-toggle"
      type="button"
      (click)="open.set(!open())"
      [attr.aria-expanded]="open()"
      aria-controls="main-nav"
      aria-label="Abrir o cerrar menú"
    >
      ☰
    </button>
    <nav id="main-nav" [class.open]="open()" aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="open.set(false)"
        >Inicio</a
      ><a
        routerLink="/noticias"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="open.set(false)"
        >Noticias</a
      ><a
        routerLink="/favoritos"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="open.set(false)"
        >Favoritos</a
      ><a
        routerLink="/gestion"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="open.set(false)"
        >Gestión</a
      ><a
        routerLink="/contacto"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="open.set(false)"
        >Contacto</a
      >
    </nav>
    <form class="header-search" (ngSubmit)="search()">
      <label class="sr-only" for="global-search">Buscar artículos</label
      ><span aria-hidden="true">⌕</span
      ><input
        id="global-search"
        name="search"
        [(ngModel)]="term"
        placeholder="Buscar artículos…"
        type="search"
      /><button type="submit" class="sr-only">Buscar</button>
    </form>
    <a
      class="favorite-access"
      routerLink="/favoritos"
      aria-label="Ver favoritos"
      ><span aria-hidden="true">☆</span
      ><span id="fav-count" aria-label="Cantidad de favoritos">{{
        store.favorites().length
      }}</span></a
    >
  </div>
</header>
